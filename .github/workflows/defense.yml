name: Contribution Defense

on:
  schedule:
    - cron: "30 15 * * *" # 00:30 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
      - "state.json"

permissions:
  contents: write

concurrency:
  group: defense
  cancel-in-progress: false

jobs:
  battle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fight tonight's siege
        uses: rim95dev/contribution-defense@fc80e0535bdc1230d9e93ea6dabe25f890f45a1f # v1.0.1

      - name: Commit battle result
        run: |
          git config user.name "defense-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist state.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "battle: $(date -u +%F) [skip ci]"
            git push
          fi
